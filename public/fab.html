<!doctype html>
<!-- The always-on-top menu button (shell/fab.js shows it in its own small window). A tap: POST /app/menu. -->
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    button {
      position: absolute; inset: 6px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85);
      background: rgba(22, 26, 48, 0.78); color: #fff; font: 26px/1 "Segoe UI", sans-serif; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); display: grid; place-items: center; padding: 0;
    }
    button:active { transform: scale(0.92); background: rgba(255, 210, 63, 0.9); color: #1b1f3a; }
  </style>
</head>
<body>
  <button id="b" type="button" title="Menu">☰</button>
  <script>
    document.getElementById('b').addEventListener('click', () => fetch('/app/menu', { method: 'POST' }).catch(() => { }));
  </script>
</body>
</html>
